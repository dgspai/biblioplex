server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the backend on the compose network. Keeps the
  # browser same-origin so CORS stays a non-issue.
  location /api/ {
    proxy_pass http://api:8000/;
    # $http_host keeps the :port; the api CSRF guard compares it to Origin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # ponytail: dev-friendly — disable browser cache so rebuilt assets
    # show on the next reload. Tighten when a real CDN/versioning lands.
    add_header Cache-Control "no-store" always;
  }
}
