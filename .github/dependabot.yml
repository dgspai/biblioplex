    directory: /
    schedule:
      interval: weekly
    ignore:
      # Bug.31: fastapi-mcp 0.4 breaks on mcp 2.x. Lift with the pyproject cap.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
