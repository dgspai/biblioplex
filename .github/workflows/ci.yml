name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # envsubst is used by `make check-web`.
      - run: sudo apt-get update && sudo apt-get install -y gettext-base

      # The Makefile resolves tools through $(VENV)/bin, so build a venv there.
      - name: Install
        run: |
          python -m venv "$PWD/.venv"
          make install VENV="$PWD/.venv"

      # No Postgres service: the suite uses in-process fakes and mocks the
      # embedding model (verified with an unreachable DATABASE_URL).
      # check-served is excluded: there is no docker stack in CI.
      - name: Gate
        run: make lint typecheck test check-web check-links VENV="$PWD/.venv"

  # Local hooks are skippable (--no-verify); this job is the real gate.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans every commit in the push / PR

      # Keep version in sync with .pre-commit-config.yaml. Binary, not
      # gitleaks-action: the action needs PR API scopes and lags releases.
      - name: Secrets (gitleaks, full history)
        env:
          V: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSfLO "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${V}_checksums.txt" | sha256sum -c --ignore-missing
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m venv "$PWD/.venv"
          make install VENV="$PWD/.venv"

      # Same path rules as the local hook, over the whole tree.
      - name: Personal-data paths
        run: .venv/bin/pre-commit run forbid-personal-data --all-files

      - name: Commit emails are noreply
        if: github.event_name == 'pull_request'
        run: |
          # --no-merges: skip GitHub's synthetic PR merge commit. Committer may
          # be noreply@github.com for Dependabot / web-UI commits.
          ok='(\S+@users\.noreply\.github\.com|noreply@github\.com)'
          bad=$(git log --no-merges --format='%h %ae %ce' "origin/${{ github.base_ref }}..HEAD" \
            | grep -vE "^[0-9a-f]+ \S+@users\.noreply\.github\.com $ok\$" || true)
          [ -z "$bad" ] || { echo "non-noreply email:"; echo "$bad"; exit 1; }

      # Fails on newly published CVEs too, without any code change: that
      # is the point. Fix by bumping the floor in pyproject.toml.
      - name: Dependency CVEs
        run: make audit VENV="$PWD/.venv"

  # After the gate, push to main only. feat/fix/breaking release (bump
  # pyproject, CHANGELOG.md, tag, GitHub release); chore/docs/ci don't.
  release:
    needs: [check, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      released: ${{ steps.psr.outputs.released }}
      version: ${{ steps.psr.outputs.version }}
      tag: ${{ steps.psr.outputs.tag }}
    steps:
      # App token: the app is the ruleset bypass actor on main; GITHUB_TOKEN
      # can't be one on a personal repo.
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      # Release exactly the commit CI tested, even if main moved meanwhile.
      - run: git reset --hard ${{ github.sha }}

      - id: psr
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ steps.app.outputs.token }}
          git_committer_name: github-actions[bot]
          git_committer_email: 41898282+github-actions[bot]@users.noreply.github.com

  # Same workflow: keeps the image build gated on this run's release output.
  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: api
            context: .
          - image: web
            context: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: dgspai/biblioplex-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
