name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # envsubst is used by `make check-web`.
      - run: sudo apt-get update && sudo apt-get install -y gettext-base

      # The Makefile resolves tools through $(VENV)/bin, so build a venv there.
      - name: Install
        run: |
          python -m venv "$PWD/.venv"
          make install VENV="$PWD/.venv"

      # No Postgres service: the suite uses in-process fakes and mocks the
      # embedding model (verified with an unreachable DATABASE_URL).
      # check-served is excluded: there is no docker stack in CI.
      - name: Gate
        run: make lint typecheck test check-web check-links VENV="$PWD/.venv"

  # Local hooks are skippable (--no-verify); this job is the real gate.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans every commit in the push / PR

      # Keep version in sync with .pre-commit-config.yaml. Binary, not
      # gitleaks-action: the action needs PR API scopes and lags releases.
      - name: Secrets (gitleaks, full history)
        env:
          V: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$V
          curl -sSfLO "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${V}_checksums.txt" | sha256sum -c --ignore-missing
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml .

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m venv "$PWD/.venv"
          make install VENV="$PWD/.venv"

      # Same path rules as the local hook, over the whole tree.
      - name: Personal-data paths
        run: .venv/bin/pre-commit run forbid-personal-data --all-files

      - name: Commit emails are noreply
        if: github.event_name == 'pull_request'
        run: |
          # --no-merges: skip GitHub's synthetic PR merge commit. Committer may
          # be noreply@github.com for Dependabot / web-UI commits.
          ok='(\S+@users\.noreply\.github\.com|noreply@github\.com)'
          bad=$(git log --no-merges --format='%h %ae %ce' "origin/${{ github.base_ref }}..HEAD" \
            | grep -vE "^[0-9a-f]+ \S+@users\.noreply\.github\.com $ok\$" || true)
          [ -z "$bad" ] || { echo "non-noreply email:"; echo "$bad"; exit 1; }

      # Fails on newly published CVEs too, without any code change: that
      # is the point. Fix by bumping the floor in pyproject.toml.
      - name: Dependency CVEs
        run: make audit VENV="$PWD/.venv"
